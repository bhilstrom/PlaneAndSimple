name: Sync Upstream & Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    # Check upstream daily at 04:17 UTC
    - cron: "17 4 * * *"

permissions:
  contents: write
  packages: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and merge upstream Zickezack/PlaneAndSimple
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Zickezack/PlaneAndSimple.git
          git fetch upstream master

          LOCAL_SHA=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base HEAD upstream/master)
          UPSTREAM_SHA=$(git rev-parse upstream/master)

          if [ "$MERGE_BASE" != "$UPSTREAM_SHA" ]; then
            echo "New upstream commits detected; merging into fork..."
            git merge upstream/master --no-edit
            git push origin master
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered manually or by push; building image..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "Sunday scheduled refresh; rebuilding for base image updates..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream changes since last build; skipping image push."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (lowercases image name automatically)
        if: steps.sync.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image to GHCR
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
